<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - VY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px border rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-base-300 min-h-screen">

    <!-- Navbar -->
    <div class="navbar bg-base-100 shadow-xl px-4 md:px-8">
        <div class="flex-1">
            <a class="text-2xl font-bold tracking-tighter text-primary">VY <span class="text-base-content font-light text-lg ml-2">| Admin</span></a>
        </div>
        <div class="flex-none gap-2">
            <button onclick="window.open('https://vynegocios8.github.io/vy-loja/', '_blank')" 
                    class="btn btn-outline btn-primary btn-sm">
              <i class="fas fa-external-link-alt"></i> Ver Loja
            </button>
        </div>
    </div>

    <main class="p-4 md:p-8 max-w-6xl mx-auto">
        <!-- Header Section -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-bold">Gestão de Produtos</h1>
                <p class="text-base-content/60">Adicione ou edite os produtos que aparecem na sua página de vendas.</p>
            </div>
            <button onclick="openModal()" class="btn btn-primary">
                <i class="fas fa-plus"></i> Novo Produto
            </button>
        </div>

        <!-- Stats -->
        <div class="stats shadow bg-base-100 w-full mb-8">
            <div class="stat">
                <div class="stat-figure text-primary">
                    <i class="fas fa-box text-3xl"></i>
                </div>
                <div class="stat-title">Total de Produtos</div>
                <div id="stat-total" class="stat-value text-primary">0</div>
                <div class="stat-desc">Sincronizado com Firestore</div>
            </div>
        </div>

        <!-- Product Grid -->
        <div id="product-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20 text-center">
            <i class="fas fa-folder-open text-6xl mb-4 opacity-20"></i>
            <h2 class="text-xl font-semibold opacity-50">Nenhum produto cadastrado</h2>
            <p class="opacity-40">Clique em "Novo Produto" para começar.</p>
        </div>
    </main>

    <!-- Modal for Add/Edit -->
    <dialog id="product_modal" class="modal">
        <div class="modal-box max-w-2xl bg-base-200">
            <h3 id="modal-title" class="font-bold text-xl mb-6">Novo Produto</h3>
            <form id="product-form" onsubmit="handleSave(event)">
                <input type="hidden" id="edit-id">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="form-control w-full">
                        <label class="label"><span class="label-text">Título do Produto</span></label>
                        <input type="text" id="title" class="input input-bordered w-full" required />
                    </div>
                    <div class="form-control w-full">
                        <label class="label"><span class="label-text">Preço (R$)</span></label>
                        <input type="text" id="price" class="input input-bordered w-full" required />
                    </div>
                </div>

                <div class="form-control w-full mt-2">
                    <label class="label"><span class="label-text">Descrição Curta</span></label>
                    <textarea id="description" class="textarea textarea-bordered h-24" required></textarea>
                </div>

                <div class="form-control w-full mt-2">
                    <label class="label"><span class="label-text">URL da Imagem</span></label>
                    <input type="url" id="image" class="input input-bordered w-full" required />
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2">
                    <div class="form-control w-full">
                        <label class="label"><span class="label-text">Texto do Botão</span></label>
                        <input type="text" id="btnText" class="input input-bordered w-full" required />
                    </div>
                    <div class="form-control w-full">
                        <label class="label"><span class="label-text">Link de Checkout</span></label>
                        <input type="url" id="checkoutLink" class="input input-bordered w-full" required />
                    </div>
                </div>

                <div class="modal-action mt-8">
                    <button type="button" onclick="closeModal()" class="btn">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar Produto</button>
                </div>
            </form>
        </div>
    </dialog>

    <!-- Script Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "SUA_API_KEY",
          authDomain: "vy-loja.firebaseapp.com",
          projectId: "vy-loja",
          storageBucket: "vy-loja.appspot.com",
          messagingSenderId: "1440651873617",
          appId: "1:140651873617:web:01d1dcb7a94c919c197f70"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let products = [];
        let productIds = [];

        async function loadProducts() {
            const querySnapshot = await getDocs(collection(db, "products"));
            products = querySnapshot.docs.map(docSnap => docSnap.data());
            productIds = querySnapshot.docs.map(docSnap => docSnap.id);
            renderProducts();
        }

        function renderProducts() {
            const list = document.getElementById('product-list');
            const empty = document.getElementById('empty-state');
            const totalStat = document.getElementById('stat-total');
            
            list.innerHTML = '';
            totalStat.innerText = products.length;

            if (products.length === 0) {
                empty.classList.remove('hidden');
            } else {
                empty.classList.add('hidden');
                products.forEach((p, index) => {
                    list.innerHTML += `
                        <div class="card bg-base-100 shadow-xl border border-white/5 overflow-hidden">
                            <figure class="h-48 overflow-hidden">
                                <img src="${p.image}" alt="${p.title}" class="w-full h-full object-cover"/>
                            </figure>
                            <div class="card-body p-5">
                                <div class="flex justify-between items-start">
                                    <h2 class="card-title text-lg">${p.title}</h2>
                                    <div class="badge badge-secondary">R$ ${p.price}</div>
                                </div>
                                <p class="text-sm opacity-70 line-clamp-2 mt-2">${p.description}</p>
                                <div class="card-actions justify-end mt-4 pt-4 border-t border-white/5">
                                    <button onclick="editProduct(${index})" class="btn btn-ghost btn-sm text-info">
                                        <i class="fas fa-edit"></i> Editar
                                    </button>
                                    <button onclick="deleteProduct(${index})" class="btn btn-ghost btn-sm text-error">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }
        }

        async function handleSave(e) {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const newProduct = {
                title: document.getElementById('title').value,
                price: document.getElementById('price').value,
                description: document.getElementById('description').value,
                image: document.getElementById('image').value,
                btnText: document.getElementById('btnText').value,
                checkoutLink: document.getElementById('checkoutLink').value
            };

            try {
                if (id === "") {
                    // Novo produto
                    await addDoc(collection(db, "products"), newProduct);
                } else {
                    // Editar produto existente
                    const productRef = doc(db, "products", productIds[id]);
                    await updateDoc(productRef, newProduct);
                }
                closeModal();
                loadProducts();
            } catch (error) {
                console.error("Erro ao salvar produto:", error);
                alert("❌ Erro ao salvar produto.");
            }
        }

        async function deleteProduct(index) {
            if (confirm('Tem certeza que deseja excluir este produto?')) {
                try {
                    const productRef = doc(db, "products", productIds[index]);
                    await deleteDoc(productRef);
                    loadProducts();
                } catch (error) {
                    console.error("Erro ao excluir produto:", error);
                    alert("❌ Erro ao excluir produto.");
                }
            }
        }

        function editProduct(index) {
            const p = products[index];
            document.getElementById('modal-title').innerText = 'Editar Produto';
            document.getElementById('edit-id').value = index;
            document.getElementById('title').value = p.title;
            document.getElementById('price').value = p.price;
            document.getElementById('description').value = p.description;
            document.getElementById('image').value = p.image;
            document.getElementById('btnText').value = p.btnText;
            document.getElementById('checkoutLink').value = p.checkoutLink;
            document.getElementById('product_modal').showModal();
        }

        function openModal() {
            document.getElementById('modal-title').innerText = 'Novo Produto';
            document.getElementById('product-form').reset();
            document.getElementById('edit-id').value = "";
            document.getElementById('product_modal').showModal();
        }

        function closeModal() {
            document.getElementById('product_modal').close();
        }

        // Inicializar
        loadProducts();
    </script>
</body>
</html>
